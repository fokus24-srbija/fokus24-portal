name: TRAG 24 - automatske vesti

on:
  workflow_dispatch:
  schedule:
  - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: fokus24-vesti
  cancel-in-progress: false

jobs:
  objavljivanje:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4
      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pokreni prikupljanje vesti
        run: python scripts/update_news.py
      - name: Sacuvaj nove vesti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "FOKUS 24: azuriranje vesti"
            git push
          fi
